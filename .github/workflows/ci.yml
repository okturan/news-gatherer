name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Verify packaged offline demo and README proof
        run: python3 scripts/render_terminal_proof.py --jar target/news-gatherer.jar --check docs/news-gatherer-terminal.svg

      - name: Retain runnable CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: news-gatherer-java-25
          path: target/news-gatherer.jar
          if-no-files-found: error
          retention-days: 7

      - name: Check patch hygiene
        run: |
          git diff --check
          git diff --exit-code
